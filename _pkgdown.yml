url: https://dereckscompany.github.io/connectcore/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/dereckscompany/connectcore
      aria-label: GitHub repository

reference:
  - title: Transport clients
    desc: >
      The abstract REST base and the concrete event-driven WebSocket base that
      connector packages extend.
    contents:
      - RestClient
      - StreamClient
      - build_request
  - title: Authentication and signing
    desc: Request signing, credential loading, and nonces.
    contents:
      - hmac_query_sign
      - load_keys
      - next_nonce
  - title: Typed conditions
    desc: >
      Classed transport errors every connector inherits and subclasses, plus the
      credential-scrubbing helper. See the taxonomy and the connector recipe.
    contents:
      - connectcore_conditions
      - abort_api_error
      - abort_response_error
      - abort_stream_error
      - scrub_url
  - title: Time conversion
    desc: Epoch and POSIXct conversions and server-time helpers.
    contents:
      - epoch_to_datetime
      - datetime_to_epoch
      - ms_to_datetime
      - datetime_to_ms
      - fetch_server_time_ms
      - then_or_now
  - title: Response parsing
    desc: JSON to data.table coercion and name conversion.
    contents:
      - as_dt_row
      - as_dt_list
      - to_snake_case
      - coerce_cols
      - collapse_string_array_fields
      - parse_json_response
  - title: Accessors and coercion
    desc: Null-safe scalar accessors and type coercion.
    contents:
      - nth_chr
      - nth_num
      - chr_or_na
      - num_or_na
      - lgl_or_na
      - coalesce_null
  - title: Environment and configuration
    desc: Environment-backed configuration lookups.
    contents:
      - env_or
      - url_getter
  - title: WebSocket helpers
    desc: >
      Backoff, event constants, typed lifecycle events, and a file sink for stream
      recorders.
    contents:
      - ws_backoff_delay
      - ws_file_sink
      - ws_event
      - WS_EVENTS
      - WS_EVENT_TYPES
  - title: Test harness
    desc: >
      A shared HTTP-mock toolkit over httr2's native mock hook, for testing and
      documenting a connector against canned fixtures (sync and async).
    contents:
      - mock_response
      - mock_router
      - body_routes
      - req_body_json
      - with_mock_api
      - local_mock_api
      - load_fixtures

articles:
  - title: Getting Started
    navbar: ~
    contents:
      - connectcore
